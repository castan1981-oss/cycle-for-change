     The ride's own parts only: the lockup lifted from the page's h1 (if the page's lockup ever changes, paste it in again),
     Overpass, flat bruise, the six muted crosswalk bars. No photo, so the card never goes stale and never needs a new OK. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Overpass";font-weight:100 900;src:url(/fonts/overpass-latin.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
:root{--fl-red:#B04A45;--fl-orange:#C47B3F;--fl-yellow:#C9A54A;--fl-green:#5C8762;--fl-blue:#4E6A9C;--fl-violet:#775A8E;
  --fl-tb:#7AAFC9;--fl-tp:#D9A3B1;--fl-tw:#EFEDEA;--fl-br:#7E5B46;--fl-bk:#332E3B}
html,body{width:1200px;height:630px;overflow:hidden;background:#1C1A22;color:#E1DFDB;font-family:"Overpass",sans-serif;-webkit-font-smoothing:antialiased}
.card{position:absolute;inset:0;padding:56px 72px 0}
.the{font-weight:800;font-size:34px;line-height:1;color:#A9BDB8;padding-left:calc(820px * .2273)}
.word{display:block;width:820px;height:auto;color:#EFEDEA;margin-top:10px}
.kick{margin-top:12px;font-weight:700;font-size:30px;line-height:1.1;color:#A9BDB8;padding-left:calc(820px * .2273)}
.when{margin-top:30px;display:flex;flex-direction:column;gap:8px;padding-left:calc(820px * .2273);white-space:nowrap}
.when b{font-weight:900;font-size:46px;line-height:1;letter-spacing:-.03em;color:#EFEDEA}
.when span{font-weight:800;font-size:26px;line-height:1.2;color:#A9BDB8}
.xwalk{position:absolute;left:72px;right:72px;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);gap:24px}
.xwalk i{display:block;height:44px}
.xwalk i:nth-child(1){background:var(--fl-red)}.xwalk i:nth-child(2){background:var(--fl-orange)}
.xwalk i:nth-child(3){background:var(--fl-yellow)}.xwalk i:nth-child(4){background:var(--fl-green)}
.xwalk i:nth-child(5){background:var(--fl-blue)}.xwalk i:nth-child(6){background:var(--fl-violet)}
</style>
</head>
