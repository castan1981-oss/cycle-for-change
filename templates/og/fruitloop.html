<!doctype html>
<!-- The share card for /fruitloop/ (1200×630), Oct 27, 2026. Bump the number when it changes (chat apps cache previews hard). Render: python3 tools/og.py templates/og/fruitloop.html cfc-site/og-fruitloop-2.jpg
     Robert's crayon logo (Oct 27, 2026), exactly as given on its own paper; the when-line in Overpass on bruise under it. No photo, so the card never goes stale and never needs a new OK. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Overpass";font-weight:100 900;src:url(/fonts/overpass-latin.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#1C1A22;color:#E1DFDB;font-family:"Overpass",sans-serif;-webkit-font-smoothing:antialiased}
.band{background:#F5F3EE;height:475px;display:flex;align-items:center;justify-content:center}
.band img{display:block;width:1200px;height:auto}
.when{height:155px;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 72px;white-space:nowrap}
.when b{font-weight:900;font-size:46px;line-height:1;letter-spacing:-.03em;color:#EFEDEA}
.when span{font-weight:800;font-size:26px;line-height:1.2;color:#A9BDB8}

</head>
<body>
<div class="band"><img src="/fruitloop/logo-1.jpg" alt=""></div>
<p class="when"><b>Every Friday from Dec 11</b><span>Meet 5:30 pm at the rainbow crosswalk, Central and Portland</span></p>
