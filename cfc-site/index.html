<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Cycle for Change — 10000, 2027, all on the bike</title>
  <meta name="description" content="Cycle for Change. 10000 miles in 2027, all on the bike. Live miles since June 1. Site in December.">
  <link rel="canonical" href="https://cycleforchange.org/">
  <meta name="robots" content="index, follow">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cycleforchange.org/">
  <meta property="og:title" content="Cycle for Change — 10000, 2027, all on the bike">
  <meta property="og:description" content="10000 miles in 2027, all on the bike. Live miles since June 1. Site in December.">
  <meta property="og:image" content="https://cycleforchange.org/og-cfc.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://cycleforchange.org/og-cfc.png">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Space+Grotesk:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/coming-soon.css">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<div class="cover">

<header class="site-head">
  <a class="mark" href="/" aria-label="Cycle for Change home">
    <svg class="mark-glyph" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
      <path d="M98.45 71.03 A40 40 0 0 1 50.32 98.81" fill="none" stroke="#2A2E28" stroke-width="12" stroke-linecap="round"/>
      <path d="M31.23 87.79 A40 40 0 0 1 31.23 32.21" fill="none" stroke="#5C6B4A" stroke-width="12" stroke-linecap="round"/>
      <path d="M50.32 21.19 A40 40 0 0 1 98.45 48.97" fill="none" stroke="#C4B7A2" stroke-width="12" stroke-linecap="round"/>
      <circle cx="60" cy="60" r="6" fill="#2A2E28"/>
    </svg>
  </a>
  <p class="meta">10000 &middot; 2027 &middot; All on the bike</p>
</header>

<main id="main">

  <section class="hero" aria-labelledby="stack">
    <h1 class="stack" id="stack">
      <span>Cycle</span>
      <span class="stack-for">For</span>
      <span>Change</span>
    </h1>

    <figure class="hero-photo">
      <img src="/hero-poster.jpg" alt="Riding view over the handlebars, desert road ahead, low sun on the horizon." width="1080" height="1920" decoding="async" fetchpriority="high">
    </figure>

    <div class="hero-foot">
      <p class="line">I do the miles. You decide who they&rsquo;re for.</p>
      <p class="tally">
        <span class="tally-num" data-cur>2,396</span>
        <span class="tally-label">miles since June 1</span>
      </p>
    </div>

    <div class="year-wrap">
      <p class="year-one" aria-label="10000">10000</p>
    </div>
  </section>

  <section class="waitlist" aria-labelledby="waitlist-head">
    <p class="eyebrow" id="waitlist-head">Site in December. Year starts January&nbsp;1.</p>

    <form class="wl-form" name="waitlist" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field" id="waitlistForm">
      <input type="hidden" name="form-name" value="waitlist">
      <p class="hp" hidden><label>Leave this empty: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
      <div class="wl-field">
        <label class="wl-label" for="wl-email">Email</label>
        <input class="wl-input" id="wl-email" name="email" type="email" required autocomplete="email" inputmode="email">
      </div>
      <button class="wl-btn" type="submit">Notify me</button>
      <p class="wl-msg" id="wlMsg" role="status" aria-live="polite"></p>
    </form>
  </section>

</main>

<footer class="site-foot">
  <span>Cycle for Change</span>
  <span>Phoenix &middot; bike only</span>
</footer>

</div>

<div class="blast" id="blast" aria-hidden="true">
  <video id="blastVid" class="blast-vid" muted playsinline preload="auto" disablepictureinpicture>
    <source src="/blast-feed.mp4" type="video/mp4">
  </video>
  <div class="punch punch-1" data-punch><span>10000</span></div>
  <div class="punch punch-2" data-punch><span>10000</span></div>
  <div class="punch punch-3" data-punch><span>10000</span></div>
  <div class="blast-grain"></div>
</div>

<audio id="bed" src="/feed-bed.m4a" preload="auto"></audio>

<script src="/coming-soon.js" defer></script>
</body>
</html>
