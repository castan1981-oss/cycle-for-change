name: CfC Content Loop

on:
  # Manual only. The schedule stays off until Robert asks for a weekly draft;
  # every run opens a PR for his voice pass, never a direct publish.
  # schedule:
  #   - cron: "0 16 * * 1"     # Mondays 9am Phoenix (UTC-7, no DST)
  workflow_dispatch: {}        # manual "Run workflow" button for testing

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  content-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model claude-sonnet-4-6 --max-turns 30 --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(cp:*),Bash(mkdir:*),Bash(ls:*),Bash(cat:*)"'
          prompt: |
            You are running one turn of the Cycle for Change content loop.
            Read CLAUDE.md first and follow it at all times. This is a static site:
            Netlify publishes `cfc-site/`, so EVERY new page lives inside `cfc-site/`.
            Field Notes posts are self-contained HTML files, NOT markdown.
            Do NOT touch `scripts/build-home.js`, `cfc-site/index.html`,
            `cfc-site/home.js`, or anything under `netlify/functions/`. The repo-root
            `index.html` and `/guides/` folder are an unpublished legacy tree.

            WHAT CYCLE FOR CHANGE IS (Oct 2026): Robert Castan rides 10,000 miles in
            2027, all on the bike. It is HIS commitment. Nobody pledges, votes or pays
            on the site; "pledge" is never a verb for visitors; there is no board.
            Cycling changed his life; he rides for himself, and the money goes through
            the orgs' own rides (Cycling 4 one·n·ten Nov 7 2026, Center Ride Out Apr
            2027, Cycle to Zero May 2027). Never write "you decide who they're for",
            the 7,500-mile swim/bike/run or Ironman framing, or miles as a fraction of
            10,000.

            GOAL: grow organic traffic to cycleforchange.org with useful pages around
            group rides, charity rides, riding in a new town, and cycling + queer
            mental health. Helping the reader is the point.

            1. READ /loop-state.json. Never repeat anything in "shipped" or
               "do_not_repeat".
            2. DISCOVER: propose 5 content opportunities (questions people search, a
               timely peg such as an org ride, or a backlog item). Tag each with
               topic, type, and rough value.
            3. DECIDE: score by (search demand x fit x freshness) / effort. Pick ONE.
               Show the math briefly.
            4. DRAFT: copy the field-notes template to
               `cfc-site/field-notes/<slug>/index.html` (<slug> is kebab-case). The
               template lives at `templates/field-notes/_template.html`; if that
               folder doesn't exist yet, use `cfc-site/field-notes/_template.html`.
               Fill every {{PLACEHOLDER}} and follow the template's top comment:
                 - Tag is exactly "Place + Miles" (chip `place`) or "Mind + Miles"
                   (chip `mind`). Mind + Miles posts MUST keep the crisis-line block
                   (988 and the Trevor Project 1-866-488-7386).
                 - Keep the head, the shared chrome, the closing block and the
                   JSON-LD BlogPosting block as the template has them; fill the
                   JSON-LD to match the page.
                 - canonical, og:url and JSON-LD url =
                   https://cycleforchange.org/field-notes/<slug>/ .
               Write informational body copy in the house voice: short sentences,
               plain, anti-polish, no buzzwords. NEVER invent Robert's experiences,
               rides, numbers or quotes, and never use Strava data. Where the post
               needs his own story, leave a `.fn-todo` block and open the PR as a
               DRAFT.
            5. WIRE IT IN:
                 - Add one row to `cfc-site/field-notes/index.html` (newest first).
                 - Add the new URL to `cfc-site/sitemap.xml`.
                 - Cross-link 2 related posts in `.fn-related` (same tag if possible).
            6. VERIFY against CLAUDE.md and show pass/fail per item: voice; banned
               words; the never-list (no "$800 / two suitcases", Prescott, est. 2008,
               age, career bragging, sober-time or relapse, 7,500 / Ironman, fraction
               of 10,000, pledging / board / vote / "you decide"); YMYL safety and the
               crisis line on Mind + Miles; SEO (target query in <title>/<h1>/<h2>,
               meta description, canonical); GEO (quotable .fn-lede, filled
               JSON-LD); brand (After Hours tokens from /chrome.css, Overpass only,
               sentence-case labels); at least one internal link to `/` or
               `/events/2027/riding/` (never /pledge/ or /#board). Confirm no
               {{PLACEHOLDER}} tokens remain. If anything fails and you can't fix it
               in one pass, open the PR as a DRAFT explaining why.
            7. UPDATE /loop-state.json: append the new item to "shipped" with status
               "drafted" (slug, title, target_query, type, page path), and add its
               target_query to "do_not_repeat".
            8. Create a new branch, commit, and open a pull request with
               `gh pr create`. Do NOT push to main. Do NOT merge. The PR body must
               include the verify results, the live URL after merge
               (https://cycleforchange.org/field-notes/<slug>/), a Search Lab line
               (`Search Lab: <what should move> · <which measure> · read <date>`),
               and the decisions Robert owns: (a) voice pass y/n, (b) publish y/n,
               (c) anything left in `.fn-todo` for his own words.
