name: CfC Ride Recap (disabled)

# DISABLED Oct 6, 2026. Do not re-enable.
#
# This workflow used to fetch the week's rides from the strava-week function,
# hand that Strava data to Claude, and publish a machine-written "Week in Miles"
# field note. That breaks two rules:
#   1. No Strava API data through any AI step or onto public pages beyond the
#      tally / ride log (Strava API Policy §2.3, §5.3, §6.2; see CLAUDE.md §10).
#   2. Ride write-ups are Robert's own words — who he met, what happened, his
#      own video. Never a machine-written recap of Strava numbers.
# It also linked to /#board and "the pledge", both retired.
#
# workflow_dispatch is kept so the job is visible in Actions, but it only prints
# this note and exits. The old prompt is in git history if anyone needs it.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ride-recap:
    runs-on: ubuntu-latest
    steps:
      - name: Disabled
        run: |
          echo "::notice title=Ride recap disabled::This bot is retired (Oct 6, 2026). It sent Strava data through Claude onto a public page, which CLAUDE.md forbids. Ride write-ups are Robert's own words — see CLAUDE.md §5 'Ride write-ups'."
          exit 0
