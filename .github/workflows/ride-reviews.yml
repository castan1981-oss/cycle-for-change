name: Ride reviews and check-ins in

# Every hour: new submissions of the ride-review form (on every ride page) → one issue each,
# labelled "review", for Robert to read. Nothing reaches the site from here.
# Post one: add the label "post" (ride-review-post.yml). Drop one: close the issue.
# Needs the NETLIFY_API_TOKEN and NETLIFY_SITE_ID secrets (the rides watch uses the same two).

# Oct 9, 2026: hourly again. The Post it / Drop it email (submission-created.js → review.js) only
# works once Resend is set up in Netlify, and the site sends no other email, so this is the path that
# always works: GitHub notifies Robert of each new "review" issue. Runs at :17 past the hour.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: ride-reviews-in
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: New reviews → issues
        env:
          NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/reviews-pull.js
      # Oct 9, 2026: check-ins from /ride/ — a "something changed" or photos → an issue labelled "checkin"
      - name: New check-ins → issues
        if: always()
        env:
          NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/checkins-pull.js
