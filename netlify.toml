[build]
  publish = "cfc-site"
  functions = "netlify/functions"
  # The rides generator runs on every deploy so "next ride" dates, Event
  # startDate and the .ics DTSTART are never older than the last deploy. A
  # weekly GitHub Action (.github/workflows/rides-weekly-rebuild.yml) triggers
  # a deploy so they never go more than a week stale. If the generator fails
  # (bad rides.json) the deploy fails and the previous deploy stays live.
  command = "npm install && node tools/build-rides.js"

[dev]
  publish = "cfc-site"
  functions = "netlify/functions"
  port = 8888

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/strava"
  to = "/.netlify/functions/strava"
  status = 200

[[redirects]]
  from = "/api/votes"
  to = "/.netlify/functions/votes"
  status = 200

[[redirects]]
  from = "/api/instagram"
  to = "/.netlify/functions/instagram"
  status = 200

# —— Live since 2026-09-18 ——
# The coming-soon gate is gone: /field-notes, /guides, /resources and /journal
# are served again. Real files win; anything else gets cfc-site/404.html.

# —— Since 2026-09-24 the redesigned page IS the homepage. ——
# /next/ (where it was previewed) goes home.

[[redirects]]
  from = "/next"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/next/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/strava-setup"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/strava-setup.html"
  to = "/"
  status = 302
  force = true

# Rides hubs that moved when the data grew. Hub names follow the data (Sept 30: Encinitas took Carlsbad's
# hub; Oct 1: Carlsbad took it back when the deep sweep added more rides). Keep old hub URLs alive:
# after every merge compare cfc-site/rides/hubs.json with the last commit and add a line here for each
# hub that vanished. Never leave a redirect pointing at a URL that no longer exists.
[[redirects]]
  from = "/rides/ca/encinitas/"
  to = "/rides/ca/carlsbad/"
  status = 301
  force = true

[[redirects]]
  from = "/rides/ca/redondo-beach/"
  to = "/rides/ca/long-beach/"
  status = 301
  force = true

[[redirects]]
