[build]
  publish = "cfc-site"
  functions = "netlify/functions"
  # The rides generator runs on every deploy so "next ride" dates, Event
  # startDate and the .ics DTSTART are never older than the last deploy. A
  # weekly GitHub Action (.github/workflows/rides-weekly-rebuild.yml) triggers
  # a deploy so they never go more than a week stale. If the generator fails
  # (bad rides.json) the deploy fails and the previous deploy stays live.
  command = "npm install && node tools/build-rides.js"

[dev]
  publish = "cfc-site"
  functions = "netlify/functions"
  port = 8888

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/strava"
  to = "/.netlify/functions/strava"
  status = 200

[[redirects]]
  from = "/api/votes"
  to = "/.netlify/functions/votes"
  status = 200

[[redirects]]
  from = "/api/instagram"
  to = "/.netlify/functions/instagram"
  status = 200

# —— Coming-soon (through December 2026) ——
# The old pages stay in the repo, they just aren't reachable. force = true is
# required: without it Netlify serves the existing file and never redirects.

[[redirects]]
  from = "/guides"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/guides/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/field-notes"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/field-notes/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/resources"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/resources/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/journal"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/journal/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/strava-setup"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/strava-setup.html"
  to = "/"
  status = 302
  force = true

# Anything else that isn't a real file goes home too. Not forced, so
# /coming-soon.css, /coming-soon.js, /hero-poster.jpg, /favicon.svg,
# /og-cfc.png and the /api/* rules above are all still served.
[[redirects]]
  from = "/*"
  to = "/"
  status = 302
