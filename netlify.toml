[build]
  publish = "cfc-site"
  functions = "netlify/functions"
  command = "npm install"

[dev]
  publish = "cfc-site"
  functions = "netlify/functions"
  port = 8888

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/strava"
  to = "/.netlify/functions/strava"
  status = 200

[[redirects]]
  from = "/api/votes"
  to = "/.netlify/functions/votes"
  status = 200

[[redirects]]
  from = "/api/instagram"
  to = "/.netlify/functions/instagram"
  status = 200

# —— Live since 2026-09-18 ——
# The coming-soon gate is gone: /field-notes, /guides, /resources and /journal
# are served again. Real files win; anything else gets cfc-site/404.html.

[[redirects]]
  from = "/next"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/next/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/strava-setup"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/strava-setup.html"
  to = "/"
  status = 302
  force = true
