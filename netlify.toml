[build]
  publish = "cfc-site"
  functions = "netlify/functions"
  # The rides generator runs on every deploy so "next ride" dates, Event
  # startDate and the .ics DTSTART are never older than the last deploy. A
  # weekly GitHub Action (.github/workflows/rides-weekly-rebuild.yml) triggers
  # a deploy so they never go more than a week stale. If the generator fails
  # (bad rides.json) the deploy fails and the previous deploy stays live.
  # Oct 21, 2026: the event pages and the 2027 calendar rebuild on deploy too (2.5 s), so an event whose date
  # has passed loses its "upcoming" Event markup the next day (El Tour, Nov 21) instead of waiting for a
  # hand rebuild. They read rides' live.json, so they run after the rides build.
  command = "npm install && node tools/build-rides.js && node scripts/build-events.js && node scripts/build-calendar.js"

[dev]
  publish = "cfc-site"
  functions = "netlify/functions"
  port = 8888

[functions]
  node_bundler = "esbuild"

# —— Headers (Oct 6, 2026). No CSP on purpose: the pages carry inline scripts and styles. ——
# geolocation stays (self): Near me on /rides/ and /tonight/ asks for the reader's location.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/film/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    # Oct 18, 2026: the originals (33 MB) are the source for tools/grade.py, not something to index or link.
    X-Robots-Tag = "noindex, nofollow"

# Oct 18, 2026: the feed and llms.txt (scripts/build-signals.js), served as what they are.
[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Oct 18, 2026 (Phase 2): the per-ride calendar files. Search Console listed ~335 of them as "crawled, not indexed";
# they are files for a calendar app, not pages. Keep them out of the index and the crawl budget.
[[headers]]
  for = "/rides/*/ride.ics"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Type = "text/calendar; charset=utf-8"

# Oct 18, 2026: the data file behind the directory. Nothing on the site reads it over HTTP (/tonight/ and
# /ride/ read live.json, hubs read index.json); it carries host contact details. Not for search engines.
[[headers]]
  for = "/rides/rides.json"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Oct 8, 2026: a short link for the reel and the caption — the Friday Shop Ride's film and reviews
# The boost graphic's QR (Oct 11, 2026): new riders land on the top of the ride page, not the reviews.
[[redirects]]
  from = "/fridayride"
  to = "/rides/scottsdale-az-bicycle-haus-friday-shop-ride/"
  status = 302
  force = true

# Oct 23, 2026: The Fruit Loop (Robert's queer First Friday night ride, from Dec 4, 2026). /fl is the poster's
# QR code (tagged so print shows up in GA4); /fruit-loop is the spelled-out link people type.
[[redirects]]
  from = "/fl"
  to = "/fruitloop/?utm_source=poster&utm_medium=print&utm_campaign=fruit-loop"
  status = 302
  force = true

[[redirects]]
  from = "/fruit-loop"
  to = "/fruitloop/"
  status = 301
  force = true

# /fruity is the handout stickers' QR code (tagged sticker, so stickers and posters read apart in GA4).
[[redirects]]
  from = "/fruity"
  to = "/fruitloop/?utm_source=sticker&utm_medium=print&utm_campaign=fruit-loop"
  status = 302
  force = true

# fruitloopphx.com is the Fruit Loop's own address (Robert, Oct 23, 2026: "its own address"). It's a domain alias on
# this Netlify site; every path on it lands on the one page, so there's one URL to keep up. No UTM tags: a shared link
# keeps its real referrer (Instagram, a text) in GA4. Works once the domain is bought and added as an alias.
[[redirects]]
  from = "https://fruitloopphx.com/*"
  to = "https://cycleforchange.org/fruitloop/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.fruitloopphx.com/*"
  to = "https://cycleforchange.org/fruitloop/"
  status = 301
  force = true

[[redirects]]
  from = "/shopride"
  to = "/rides/scottsdale-az-bicycle-haus-friday-shop-ride/#reviews"
  status = 302
  force = true

# Oct 10, 2026: a short link for TSR (the QR Robert sends riders) — opens TSR in the ride check-in at /ride/,
