[build]
  publish = "cfc-site"
  functions = "netlify/functions"
  # The rides generator runs on every deploy so "next ride" dates, Event
  # startDate and the .ics DTSTART are never older than the last deploy. A
  # weekly GitHub Action (.github/workflows/rides-weekly-rebuild.yml) triggers
  # a deploy so they never go more than a week stale. If the generator fails
  # (bad rides.json) the deploy fails and the previous deploy stays live.
  command = "npm install && node tools/build-rides.js"

[dev]
  publish = "cfc-site"
  functions = "netlify/functions"
  port = 8888

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/strava"
  to = "/.netlify/functions/strava"
  status = 200

[[redirects]]
  from = "/api/votes"
  to = "/.netlify/functions/votes"
  status = 200

[[redirects]]
  from = "/api/instagram"
  to = "/.netlify/functions/instagram"
  status = 200

# —— Live since 2026-09-18 ——
# The coming-soon gate is gone: /field-notes, /guides, /resources and /journal
# are served again. Real files win; anything else gets cfc-site/404.html.

# —— Pass 26 (Oct 5, 2026): the pledge is gone. /pledge/ goes home. ——
[[redirects]]
  from = "/pledge"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pledge/*"
  to = "/"
  status = 301
  force = true

# —— Since 2026-09-24 the redesigned page IS the homepage. ——
# /next/ (where it was previewed) goes home.

[[redirects]]
  from = "/next"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/next/*"
  to = "/"
  status = 301
  force = true

# Search pass (Oct 6, 2026): the field-note templates live in cfc-site/ because the content workflows copy them
# from there; they are never pages. 404 them so Google drops them (one rule per path: a splat only matches a whole segment).
[[redirects]]
  from = "/field-notes/_template.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/field-notes/_template"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/field-notes/_pillar-template.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/field-notes/_pillar-template"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/strava-setup"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/strava-setup.html"
  to = "/"
  status = 302
  force = true

# Rides hubs that moved when the data grew. Hub names follow the data (Sept 30: Encinitas took Carlsbad's
# hub; Oct 1: Carlsbad took it back when the deep sweep added more rides). Keep old hub URLs alive:
